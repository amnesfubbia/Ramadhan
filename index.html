function go(h){location.hash=h}
function toggleTheme(){document.documentElement.classList.toggle("dark");localStorage.setItem("silk_theme",document.documentElement.classList.contains("dark")?"dark":"light")}
if(localStorage.getItem("silk_theme")==="dark")document.documentElement.classList.add("dark");
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function audio(label){return `<div class="audio"><button onclick="speak('${esc(label).replace(/'/g,"\\'")}')">▶</button> <span class="small muted">Audio</span></div>`}
function speak(t){if("speechSynthesis"in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang="id-ID";speechSynthesis.speak(u)}}
function cardButton(id,title){return `<button class="btn full" onclick="go('#/detail/${id}')">${esc(title)}</button>`}
function renderHome(){return `<div class=page><div class=card><span class=tag>HIJRIYAH</span><h1 id=hijri>Kalender Hijriah</h1><div class=muted id=greg></div><p class=small>Ayat / hadis / dalil harian ditampilkan di sini.</p></div><h2>Menu Utama</h2><div class=grid>${menus.map(m=>`<button class="card menu" onclick="go('#/menu/${m.id}')"><span class=mi>${m.i}</span><h3>${m.n}</h3><p>${m.d}</p></button>`).join("")}</div></div>`}
function renderMenu(id){let m=menus.find(x=>x.id==id);if(!m)return renderHome();return `<div class=page><h1>${m.n}</h1><p class=muted>${m.d}</p><div class=grid style="margin-top:14px">${m.items.map(x=>`<button class="card menu" onclick="go('#/detail/${x[0]}')"><span class=mi>•</span><h3>${x[1]}</h3><p>${x[2]}</p></button>`).join("")}</div></div>`}
function section(s){if(s.length===2)return `<div class=section><h2>${esc(s[0])}</h2><p class=explain>${esc(s[1])}</p></div>`;return `<div class=section><h2>${esc(s[0])}</h2><div class=arabic><div class=ar>${s[1]}</div><div class=meaning>${esc(s[2])}</div>${audio(s[0])}</div></div>`}
function renderList(title,ex,arr){return `<div class=page><h1>${title}</h1><p class=explain muted>${ex}</p><h2>Daftar</h2>${arr.map((x,i)=>`<button class=row onclick="go('#/item/${title==='Nama-Nama Surga'?'surga':'neraka'}/${i}')"><span class=tag>${String(i+1).padStart(2,"0")}</span><span class=grow><b>${esc(x[0])}</b><br><span class=small muted>${esc(x[1])}</span></span><span class=chev>›</span></button>`).join("")}</div>`}
function renderIqra(n){let desc=["Iqra 1 mengenalkan huruf hijaiyah dan latihan dasar membaca.","Iqra 2 melanjutkan latihan penggabungan huruf dan bacaan sederhana.","Iqra 3 memperluas latihan rangkaian huruf dan harakat.","Iqra 4 memperkenalkan latihan bacaan yang lebih beragam.","Iqra 5 memperkuat kelancaran membaca rangkaian bacaan.","Iqra 6 mempersiapkan pembaca menuju bacaan Al-Qur'an yang lebih lancar."][n-1];return `<div class=page><h1>Iqra ${n}</h1><p class=explain>${desc}</p><h2>Halaman Iqra</h2><div class=card><div class=ar>بِسْمِ اللهِ<br>اَ  اِ  اُ<br>بَ  بِ  بُ<br>تَ  تِ  تُ</div><p class=small muted>Halaman latihan ditampilkan setelah penjelasan materi.</p></div></div>`}
function renderDetail(id){if(id==="malaikat-list")return `<div class=page><h1>Nama & Tugas Malaikat</h1><p class=muted>Daftar nama dan tugas malaikat yang umum dipelajari.</p>${angels.map(x=>`<div class=row><span class=tag>•</span><span class=grow><b>${x[0]}</b><br><span class=small muted>${x[1]}</span></span></div>`).join("")}</div>`;
if(id==="surga")return renderList("Nama-Nama Surga","Balasan bagi orang beriman dan bertakwa — kenikmatan yang belum pernah dilihat mata. Catatan: QS. As-Sajdah 32:17 menyebut kenikmatan yang tidak diketahui manusia sebelumnya.",heavens);
if(id==="neraka")return renderList("Nama-Nama Neraka","Neraka adalah tempat balasan bagi orang yang mendapatkan hukuman Allah. Penjelasan setiap nama disajikan secara ringkas dan edukatif.",hells);
if(id.startsWith("iqra"))return renderIqra(+id.slice(4));
if(id==="alquran")return `<div class=page><h1>Al-Qur'an</h1><p class=explain>Al-Qur'an adalah wahyu Allah yang diturunkan kepada Nabi Muhammad ﷺ. Materi pembelajaran mencakup mushaf, surat, ayat, terjemah, tafsir dan ilmu Al-Qur'an.</p><h2>Materi</h2>${cardButton("mushaf","Mushaf")}${cardButton("juz","Juz")}</div>`;
if(id==="hijaiyah-list")return `<div class=page><h1>Huruf Hijaiyah</h1><p class=muted>Kenali bentuk dasar huruf Arab sebelum mempelajari harakat dan rangkaian bacaan.</p><div class=grid style="margin-top:14px">${"ا ب ت ث ج ح خ د ذ ر ز س ش ص ض ط ظ ع غ ف ق ك ل م ن و ه ي".split(" ").map((x,i)=>`<div class=card style="text-align:center"><div class=ar style="text-align:center;font-size:46px">${x}</div><b>${i+1}</b></div>`).join("")}</div></div>`;
let p=pages[id];if(!p)return `<div class=page><h1>Materi</h1><p>Materi belum ditemukan.</p></div>`;
let b=(p.buttons||[]).map(x=>cardButton(x[0],x[1])).join("");
return `<div class=page><h1>${p.title}</h1><p class=explain>${p.ex}</p>${b}${(p.sections||[]).map(section).join("")}</div>`}
const CAL_MONTHS=["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadan","Syawal","Zulkaidah","Zulhijah"];
const CAL_EVENTS={
  "3-12":{title:"Maulid Nabi Muhammad ﷺ",text:"Peringatan kelahiran Nabi Muhammad ﷺ. Tanggal kelahiran diperselisihkan; 12 Rabiul Awal adalah pendapat yang masyhur, sementara sebagian riwayat menyebut tanggal lain."},
  "1-10":{title:"Asyura",text:"Hari ke-10 Muharram yang dikenal sebagai hari Asyura."},
  "9-1":{title:"Awal Ramadan",text:"Awal Ramadan ditentukan berdasarkan masuknya bulan Ramadan sesuai metode penetapan yang digunakan."},
  "9-27":{title:"Malam yang dikenal sebagai Lailatul Qadar",text:"Al-Qur'an menyebut Lailatul Qadar sebagai malam yang lebih baik daripada seribu bulan. Tanggal pastinya tidak ditetapkan secara tunggal."},
  "10-1":{title:"Idulfitri",text:"Hari pertama Syawal, hari raya Idulfitri."},
  "12-9":{title:"Hari Arafah",text:"Tanggal 9 Zulhijah, hari Arafah dan salah satu hari penting dalam rangkaian ibadah haji."},
  "12-10":{title:"Iduladha",text:"Hari pertama Iduladha, bertepatan dengan 10 Zulhijah."}
};
let calView={y:null,m:null,selected:null};

function hijriParts(date){
  try{
    const f=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{year:"numeric",month:"numeric",day:"numeric"});
    const p=f.formatToParts(date), get=k=>Number(p.find(x=>x.type===k)?.value);
    return {y:get("year"),m:get("month"),d:get("day")};
  }catch(e){
    return {y:1448,m:4,d:7};
  }
}
function gregLabel(date){
  return new Intl.DateTimeFormat("id-ID",{day:"numeric",month:"short"}).format(date);
}
function gregFull(date){
  return new Intl.DateTimeFormat("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"}).format(date);
}
function findHijriDate(y,m,d,nearDate){
  const base=new Date(nearDate);
  for(let offset=-420;offset<=420;offset++){
    const x=new Date(base); x.setDate(base.getDate()+offset);
    const h=hijriParts(x);
    if(h.y===y&&h.m===m&&h.d===d)return x;
  }
  return null;
}
function shiftHijriMonth(y,m,delta,nearDate){
  let total=y*12+(m-1)+delta;
  const ny=Math.floor(total/12), nm=(total%12)+1;
  return {y:ny,m:nm,date:findHijriDate(ny,nm,1,nearDate)||new Date(nearDate)};
}
function dateFromView(y,m,d,nearDate){
  return findHijriDate(y,m,d,nearDate);
}
function selectCalDate(y,m,d){
  const date=dateFromView(y,m,d,calView.selected||new Date());
  if(date)calView.selected=date;
  renderCalendarIntoApp();
}
function calInfo(h){
  const ev=CAL_EVENTS[`${h.m}-${h.d}`];
  if(ev)return `<div class="card"><span class="tag">${h.d} ${CAL_MONTHS[h.m-1]}</span><h2>${ev.title}</h2><p class="muted">${ev.text}</p><p class="small muted">Masehi: ${gregFull(calView.selected)}</p></div>`;
  return `<div class="card"><p><b>Tidak ada peristiwa khusus yang dicatat untuk tanggal ini.</b></p><p class="muted">Informasi peristiwa dan peringatan ditampilkan bila tersedia dalam basis data kalender. Tidak dibuat-buat dari tanggal Masehi.</p><p class="small muted">Tanggal dipilih: ${h.d} ${CAL_MONTHS[h.m-1]} ${h.y} H · ${gregFull(calView.selected)}</p></div>`;
}
function renderCalendarIntoApp(){
  const app=document.getElementById("app");
  const today=new Date();
  const current=hijriParts(today);
  if(calView.y===null){calView.y=current.y;calView.m=current.m;calView.selected=today;}
  const first=dateFromView(calView.y,calView.m,1,calView.selected||today);
  const last=shiftHijriMonth(calView.y,calView.m,1,first||today);
  const days=last?Math.round((last.date-first)/86400000):30;
  let firstDow=(first?first.getDay():1); // JS: Ahad=0
  firstDow=(firstDow+6)%7; // Senin=0
  let cells="";
  for(let i=0;i<firstDow;i++)cells+=`<div class="date empty"></div>`;
  for(let d=1;d<=days;d++){
    const gd=dateFromView(calView.y,calView.m,d,first||today);
    if(!gd)continue;
    const isToday=gd.toDateString()===today.toDateString();
    const isSelected=calView.selected&&gd.toDateString()===calView.selected.toDateString();
    cells+=`<button class="date ${isToday?"today ":""}${isSelected?"selected":""}" onclick="selectCalDate(${calView.y},${calView.m},${d})"><b>${d}</b><small>${gregLabel(gd)}</small></button>`;
  }
  const sh=hijriParts(calView.selected||today);
  app.innerHTML=`<div class="page">
    <h1>Kalender Hijriah</h1>
    <p class="muted">Tanggal Hijriah menjadi tanggal utama; tanggal Masehi ditampilkan lebih kecil.</p>
    <div class="card" style="border-left:7px solid var(--accent);margin-bottom:14px">
      <span class="tag">TANGGAL DIPILIH</span>
      <h2 style="font-size:25px;color:var(--accent);margin:5px 0">${sh.d} ${CAL_MONTHS[sh.m-1]} ${sh.y} H</h2>
      <div class="muted">${gregFull(calView.selected||today)}</div>
    </div>
    <div class="card">
      <div class="calendar-head">
        <button class="month-nav" onclick="changeCalMonth(-1)" aria-label="Bulan sebelumnya">‹</button>
        <div class="month-title">${CAL_MONTHS[calView.m-1]} ${calView.y} H</div>
        <button class="month-nav" onclick="changeCalMonth(1)" aria-label="Bulan berikutnya">›</button>
      </div>
      <div class="calendar">
        ${["SENIN","SELASA","RABU","KAMIS","JUMAT","SABTU","MINGGU"].map(x=>`<div class="day">${x}</div>`).join("")}
        ${cells}
      </div>
    </div>
    <h2>Informasi — ${sh.d} ${CAL_MONTHS[sh.m-1]}</h2>
    ${calInfo(sh)}
  </div>`;
}
function changeCalMonth(delta){
  const shifted=shiftHijriMonth(calView.y,calView.m,delta,calView.selected||new Date());
  calView.y=shifted.y;calView.m=shifted.m;
  const first=shifted.date;
  calView.selected=first;
  renderCalendarIntoApp();
}
function renderCalendar(){return `<div class=page><div class=card>Memuat kalender Hijriah…</div></div>`}
function renderSettings(){return `<div class=page><h1>Pengaturan</h1><div class=card><h2>Tampilan</h2><button class=btn onclick="toggleTheme()">Ganti Dark AMOLED / Light</button><h2>Ukuran Teks</h2><button class=btn onclick="document.body.style.fontSize='14px'">Normal</button> <button class=btn onclick="document.body.style.fontSize='16px'">Besar</button></div></div>`}
function render(){let h=location.hash||"#/home",out;if(h==="#/home")out=renderHome();else if(h==="#/settings")out=renderSettings();else if(h==="#/koleksi")out=`<div class=page><h1>Koleksi</h1><div class=card><p>Bookmark dan materi tersimpan akan muncul di sini.</p></div></div>`;else if(h==="#/calendar"||h==="#/menu/10")out=renderCalendar();else if(h.startsWith("#/menu/"))out=renderMenu(h.split("/")[2]);else if(h.startsWith("#/detail/"))out=renderDetail(decodeURIComponent(h.split("/").slice(2).join("/")));else if(h.startsWith("#/item/")){let z=h.split("/"),arr=z[2]==="surga"?heavens:hells,i=+z[3],x=arr[i];out=`<div class=page><h1>${x[0]}</h1><p class=explain>${x[1]}</p></div>`}else out=renderHome();document.getElementById("app").innerHTML=out;if(h==="#/calendar"||h==="#/menu/10")renderCalendarIntoApp();document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>go(b.dataset.nav));let n=location.hash.includes("/menu/2")?"rukun":location.hash.includes("/menu/1")?"islam":location.hash.includes("settings")?"settings":"home";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.nav.includes(n)));if(h==="#/home"){let d=new Date();document.getElementById("greg").textContent=d.toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"});document.getElementById("hijri").textContent="Tanggal Hijriah — lihat kalender Hijriah";}}
window.addEventListener("hashchange",render);render();
</script>
</body>
</html>
