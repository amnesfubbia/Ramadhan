/* ========== ASMAUL HUSNA (99 NAMA) ========== */
const ASMA = [
["الرَّحْمَنُ","Ar-Rahman","Yang Maha Pengasih","Kasih sayang Allah meliputi seluruh makhluk tanpa terkecuali, mukmin maupun kafir, selama hidup di dunia ini.","Diucapkan mengawali setiap perbuatan baik (basmalah) sebagai pengakuan bahwa segala kebaikan berasal dari kasih sayang-Nya yang luas.","QS. Al-Fatihah 1:3; QS. Ar-Rahman 55:1-2"],
["الرَّحِيمُ","Ar-Rahim","Yang Maha Penyayang","Kasih sayang Allah yang khusus diperuntukkan bagi orang-orang beriman kelak di akhirat.","Dipanjatkan dalam doa memohon rahmat khusus atas ketaatan dan keistiqamahan dalam iman.","QS. Al-Ahzab 33:43"],
["الْمَلِكُ","Al-Malik","Yang Maha Merajai","Pemilik dan penguasa mutlak atas seluruh alam semesta, tiada sekutu dan tiada yang menandingi kekuasaan-Nya.","Diingat ketika merasa lemah di hadapan penguasa dunia, untuk menyadari bahwa kekuasaan sejati hanya milik Allah.","QS. Al-Mu'minun 23:116; QS. Al-Hasyr 59:23"],
["الْقُدُّوسُ","Al-Quddus","Yang Maha Suci","Allah suci dari segala kekurangan, sekutu, dan sifat yang tidak layak bagi kesempurnaan-Nya.","Diucapkan dalam tasbih (subhanallah) untuk menyucikan Allah dari segala persangkaan buruk atau penyerupaan dengan makhluk.","QS. Al-Hasyr 59:23; QS. Al-Jumu'ah 62:1"],
["السَّلَامُ","As-Salam","Yang Maha Sejahtera","Allah adalah sumber keselamatan, bebas dari segala cela dan kekurangan, serta pemberi keselamatan bagi hamba-Nya.","Dimohon ketika mendambakan keselamatan dunia dan akhirat, sebagaimana ucapan salam yang menjadi doa keselamatan antar-sesama muslim.","QS. Al-Hasyr 59:23"],
["الْمُؤْمِنُ","Al-Mu'min","Yang Maha Memberi Keamanan","Allah memberi rasa aman bagi hamba-Nya yang beriman dan menjadi saksi kebenaran atas diri-Nya sendiri.","Dimohon ketika dilanda rasa takut atau cemas, memohon rasa aman yang hakiki hanya dari Allah.","QS. Al-Hasyr 59:23"],
["الْمُهَيْمِنُ","Al-Muhaimin","Yang Maha Memelihara","Allah mengawasi, menyaksikan, dan memelihara seluruh makhluk-Nya tanpa lalai sedikit pun.","Menumbuhkan kesadaran bahwa setiap perbuatan senantiasa diawasi Allah (muraqabah), mendorong sikap ihsan dalam ibadah.","QS. Al-Hasyr 59:23"],
["الْعَزِيزُ","Al-'Aziz","Yang Maha Perkasa","Keperkasaan Allah tidak terkalahkan oleh apa pun, mutlak dan sempurna.","Dimohon ketika menghadapi musuh atau kesulitan besar, memohon kekuatan dan kemenangan dari Yang Mahaperkasa.","QS. Al-Hasyr 59:23-24"],
["الْجَبَّارُ","Al-Jabbar","Yang Maha Berkehendak","Allah mampu memaksakan kehendak-Nya atas seluruh makhluk dan memperbaiki keadaan hamba-Nya yang lemah.","Dimohon ketika hati terasa keras atau retak, memohon Allah memperbaiki keadaan diri menuju kebaikan.","QS. Al-Hasyr 59:23"],
["الْمُتَكَبِّرُ","Al-Mutakabbir","Yang Maha Besar","Hanya Allah yang berhak atas kebesaran mutlak; kesombongan makhluk terhadap sesama adalah dosa besar.","Mengingatkan diri untuk senantiasa rendah hati (tawadhu) di hadapan manusia karena kebesaran sejati hanya milik Allah.","QS. Al-Hasyr 59:23"],
["الْخَالِقُ","Al-Khaliq","Yang Maha Pencipta","Allah menciptakan segala sesuatu dari tiada menjadi ada, tanpa bahan dan tanpa contoh sebelumnya.","Direnungkan saat mentadaburi ciptaan alam semesta untuk menguatkan keimanan akan kebesaran Sang Pencipta.","QS. Ar-Ra'd 13:16; QS. Al-Hasyr 59:24"],
["الْبَارِئُ","Al-Bari'","Yang Maha Mengadakan","Allah mewujudkan ciptaan sesuai rancangan yang sempurna dan seimbang, tanpa cacat.","Dimohon ketika memulai suatu usaha baru, memohon agar hasil yang diwujudkan berjalan baik dan seimbang.","QS. Al-Hasyr 59:24"],
["الْمُصَوِّرُ","Al-Mushawwir","Yang Maha Membentuk Rupa","Allah membentuk rupa setiap makhluk dengan bentuk yang berbeda-beda dan unik, penuh keindahan.","Direnungkan untuk mensyukuri bentuk fisik yang telah dianugerahkan Allah kepada diri sendiri.","QS. Al-Hasyr 59:24; QS. Al-Infithar 82:8"],
["الْغَفَّارُ","Al-Ghaffar","Yang Maha Pengampun","Allah senantiasa mengampuni dosa hamba-Nya yang bertaubat, berulang kali tanpa batas selama hamba itu kembali kepada-Nya.","Dipanjatkan dalam istighfar berulang-ulang, terutama setelah melakukan dosa yang sama berkali-kali.","QS. Thaha 20:82"],
["الْقَهَّارُ","Al-Qahhar","Yang Maha Menundukkan","Allah menundukkan segala sesuatu di alam semesta dengan kekuasaan-Nya yang mutlak, tidak ada yang dapat melawan-Nya.","Dimohon ketika merasa tertindas kezaliman, memohon Allah menundukkan pihak yang berbuat zalim.","QS. Ar-Ra'd 13:16; QS. Yusuf 12:39"],
["الْوَهَّابُ","Al-Wahhab","Yang Maha Pemberi","Allah memberi karunia secara cuma-cuma kepada siapa pun yang dikehendaki-Nya, tanpa mengharap balasan.","Dipanjatkan ketika memohon karunia besar tanpa merasa berhak menerimanya, murni mengharap kemurahan Allah.","QS. Shad 38:9, 35"],
["الرَّزَّاقُ","Ar-Razzaq","Yang Maha Pemberi Rezeki","Allah menjamin rezeki setiap makhluk yang bernyawa di bumi, sesuai ketentuan-Nya yang bijaksana.","Dipanjatkan dalam doa memohon kelapangan rezeki dan keberkahan dalam usaha.","QS. Adz-Dzariyat 51:58"],
["الْفَتَّاحُ","Al-Fattah","Yang Maha Pembuka","Allah membuka pintu rahmat, rezeki, dan solusi bagi hamba-Nya, serta memutuskan perkara dengan seadil-adilnya.","Dimohon ketika menghadapi jalan buntu, memohon Allah membukakan jalan keluar dan kemudahan.","QS. Saba' 34:26"],
["الْعَلِيمُ","Al-'Alim","Yang Maha Mengetahui","Ilmu Allah meliputi segala sesuatu, yang tampak maupun tersembunyi, masa lalu, kini, dan mendatang.","Menumbuhkan kejujuran dan rasa malu berbuat maksiat karena menyadari Allah mengetahui segalanya.","QS. Al-Baqarah 2:29; QS. Al-Hujurat 49:16"],
["الْقَابِضُ","Al-Qabidh","Yang Maha Menyempitkan","Allah berkuasa menyempitkan rezeki, jiwa, atau keadaan seorang hamba sesuai hikmah-Nya.","Menumbuhkan kesabaran ketika rezeki terasa sempit, meyakini itu bagian dari hikmah dan ujian Allah.",""],
["الْبَاسِطُ","Al-Basith","Yang Maha Melapangkan","Allah berkuasa melapangkan rezeki dan kelegaan hati bagi siapa yang dikehendaki-Nya.","Dipanjatkan dalam doa memohon kelapangan hati dan rezeki di saat sempit.","QS. Al-Baqarah 2:245"],
["الْخَافِضُ","Al-Khafidh","Yang Maha Merendahkan","Allah merendahkan derajat orang-orang yang sombong dan durhaka kepada-Nya.","Direnungkan sebagai peringatan agar tidak bersikap sombong, karena Allah mampu merendahkan siapa saja.",""],
["الرَّافِعُ","Ar-Rafi'","Yang Maha Meninggikan","Allah meninggikan derajat hamba-Nya yang beriman dan bertakwa, di dunia maupun akhirat.","Dipanjatkan dalam doa memohon derajat yang mulia di sisi Allah dan di tengah manusia.","QS. Al-Mujadilah 58:11; QS. Al-An'am 6:83"],
["الْمُعِزُّ","Al-Mu'izz","Yang Maha Memuliakan","Allah memberikan kemuliaan dan kehormatan kepada siapa yang Dia kehendaki.","Dipanjatkan ketika memohon kemuliaan atas suatu urusan atau kedudukan yang dihadapi.","QS. Ali 'Imran 3:26"],
["الْمُذِلُّ","Al-Mudzill","Yang Maha Menghinakan","Allah dapat mencabut kemuliaan dan menghinakan siapa pun yang dikehendaki-Nya, sebagai balasan atas kesombongan atau kekufuran.","Direnungkan sebagai peringatan agar senantiasa bergantung dan bersyukur kepada Allah, bukan kepada kedudukan duniawi.","QS. Ali 'Imran 3:26"],
["السَّمِيعُ","As-Sami'","Yang Maha Mendengar","Allah mendengar segala sesuatu, sekecil apa pun bisikan hati hamba-Nya, tanpa ada yang terlewat.","Menumbuhkan keyakinan bahwa setiap doa dan keluh kesah pasti didengar Allah, sekalipun diucapkan dalam hati.","QS. Al-Baqarah 2:127; QS. Al-Mujadilah 58:1"],
["الْبَصِيرُ","Al-Bashir","Yang Maha Melihat","Allah melihat segala perbuatan hamba-Nya, baik yang tampak maupun tersembunyi.","Menumbuhkan sikap ihsan dalam beramal, seolah-olah selalu diawasi Allah dalam setiap tindakan.","QS. Al-Hujurat 49:18; QS. Asy-Syura 42:11"],
["الْحَكَمُ","Al-Hakam","Yang Maha Menetapkan","Allah adalah pemutus dan penetap hukum yang paling adil atas segala perkara.","Dimohon ketika menghadapi perselisihan, memohon Allah menetapkan keputusan yang paling adil.","QS. Al-An'am 6:114"],
["الْعَدْلُ","Al-'Adl","Yang Maha Adil","Keadilan Allah sempurna, tidak pernah menzalimi hamba-Nya sedikit pun.","Menumbuhkan ketenangan hati menerima ketentuan Allah, meyakini semuanya adil meski belum tampak hikmahnya.","QS. An-Nisa' 4:40; QS. Yunus 10:44"],
["اللَّطِيفُ","Al-Lathif","Yang Maha Lembut","Allah Mahalembut dalam memberi kebaikan kepada hamba-Nya dengan cara yang halus, bahkan yang tak terduga.","Dipanjatkan ketika memohon kemudahan yang lembut dalam urusan yang tampak berat dan rumit.","QS. Al-An'am 6:103; QS. Al-Mulk 67:14"],
["الْخَبِيرُ","Al-Khabir","Yang Maha Mengenal","Allah mengetahui secara mendalam hakikat batin segala sesuatu, melampaui sekadar ilmu lahiriah.","Menumbuhkan kesadaran bahwa Allah mengenal isi hati, mendorong keikhlasan dalam beramal.","QS. Al-An'am 6:103; QS. Luqman 31:34"],
["الْحَلِيمُ","Al-Halim","Yang Maha Penyantun","Allah tidak segera menghukum hamba-Nya yang berbuat dosa, memberi kesempatan untuk bertaubat.","Dipanjatkan agar diberi kesabaran dan tidak tergesa-gesa marah dalam menghadapi kesalahan orang lain.","QS. Al-Baqarah 2:225, 235"],
["الْعَظِيمُ","Al-'Azhim","Yang Maha Agung","Keagungan Allah tidak terbatas, meliputi seluruh sifat kesempurnaan-Nya.","Diucapkan dalam tasbih \"Subhanallahil-'Azhim\" untuk mengagungkan Allah dalam ruku' shalat.","QS. Al-Baqarah 2:255; QS. Al-Waqi'ah 56:96"],
["الْغَفُورُ","Al-Ghafur","Yang Maha Pengampun","Allah senantiasa memberi ampunan yang luas bagi hamba-Nya yang bertaubat dengan sungguh-sungguh.","Dipanjatkan dalam istighfar harian sebagai permohonan ampun atas dosa yang telah lalu.","QS. Al-Baqarah 2:173; QS. Az-Zumar 39:53"],
["الشَّكُورُ","Asy-Syakur","Yang Maha Mensyukuri","Allah memberi balasan berlipat ganda atas amal kebaikan sekecil apa pun yang dilakukan hamba-Nya.","Menumbuhkan semangat beramal meski kecil, meyakini Allah akan menghargainya dengan pahala besar.","QS. Fathir 35:30, 34"],
["الْعَلِيُّ","Al-'Aliyy","Yang Maha Tinggi","Allah memiliki keagungan dan kedudukan yang tertinggi, di atas segala sesuatu, baik secara zat maupun kekuasaan.","Diucapkan dalam tasbih sujud \"Subhana Rabbiyal-A'la\" sebagai pengagungan kepada Allah Yang Mahatinggi.","QS. Al-Baqarah 2:255; QS. An-Nisa' 4:34"],
["الْكَبِيرُ","Al-Kabir","Yang Maha Besar","Kebesaran Allah melampaui segala sesuatu, tiada yang lebih besar dari-Nya dalam segala hal.","Diucapkan dalam takbir \"Allahu Akbar\" sebagai pengakuan bahwa Allah lebih besar dari segala urusan dunia.","QS. Ar-Ra'd 13:9; QS. Saba' 34:23"],
["الْحَفِيظُ","Al-Hafizh","Yang Maha Menjaga","Allah menjaga langit, bumi, dan seluruh makhluk-Nya dari kehancuran serta menjaga catatan amal setiap hamba.","Dipanjatkan memohon perlindungan dan penjagaan diri, keluarga, serta amal dari kerusakan.","QS. Hud 11:57; QS. Yusuf 12:64"],
["الْمُقِيتُ","Al-Muqit","Yang Maha Memberi Kecukupan","Allah memberi kecukupan pangan dan kebutuhan bagi setiap makhluk yang diciptakan-Nya.","Dipanjatkan memohon kecukupan atas kebutuhan hidup sehari-hari.","QS. An-Nisa' 4:85"],
["الْحَسِيبُ","Al-Hasib","Yang Maha Membuat Perhitungan","Allah mencukupkan segala kebutuhan hamba-Nya dan memperhitungkan setiap amal dengan teliti.","Menumbuhkan sikap muhasabah (introspeksi diri) sebelum kelak dihisab oleh Allah di akhirat.","QS. An-Nisa' 4:6, 86"],
["الْجَلِيلُ","Al-Jalil","Yang Maha Mulia","Allah memiliki keagungan sifat dan kesempurnaan yang tiada tara.","Direnungkan untuk menumbuhkan kekaguman dan kecintaan mendalam kepada Allah atas keagungan-Nya.","QS. Ar-Rahman 55:27 (Dzul Jalal wal Ikram)"],
["الْكَرِيمُ","Al-Karim","Yang Maha Pemurah","Allah memberi kebaikan yang melimpah kepada hamba-Nya tanpa diminta, dan memaafkan dengan mulia.","Dipanjatkan dalam doa memohon karunia dan kemurahan-Nya yang luas.","QS. An-Naml 27:40; QS. Al-Infithar 82:6"],
["الرَّقِيبُ","Ar-Raqib","Yang Maha Mengawasi","Allah senantiasa mengawasi setiap gerak-gerik hamba-Nya tanpa pernah lengah.","Menumbuhkan kehati-hatian dalam bertindak, menyadari diri selalu dalam pengawasan Allah.","QS. An-Nisa' 4:1; QS. Al-Ahzab 33:52"],
["الْمُجِيبُ","Al-Mujib","Yang Maha Mengabulkan","Allah mengabulkan doa hamba-Nya yang berdoa dengan tulus dan penuh harap.","Menumbuhkan keyakinan penuh (husnuzhan) saat berdoa bahwa Allah pasti mengabulkan dengan cara terbaik.","QS. Hud 11:61; QS. Al-Baqarah 2:186"],
["الْوَاسِعُ","Al-Wasi'","Yang Maha Luas","Keluasan rahmat, ilmu, dan karunia Allah tidak terbatas oleh apa pun.","Dipanjatkan memohon keluasan rezeki dan ilmu yang melimpah dari Allah.","QS. Al-Baqarah 2:115, 268"],
["الْحَكِيمُ","Al-Hakim","Yang Maha Bijaksana","Setiap ketetapan dan perbuatan Allah mengandung hikmah yang sempurna, tiada yang sia-sia.","Menumbuhkan ketenangan menerima takdir, meyakini ada hikmah di balik setiap kejadian.","QS. Al-Baqarah 2:129; QS. Luqman 31:27"],
["الْوَدُودُ","Al-Wadud","Yang Maha Mencintai","Allah mencintai hamba-hamba-Nya yang saleh dan mencintai kebaikan yang mereka perbuat.","Dipanjatkan memohon dicintai Allah dan dijadikan hati mencintai kebaikan.","QS. Hud 11:90; QS. Al-Buruj 85:14"],
["الْمَجِيدُ","Al-Majid","Yang Maha Mulia","Kemuliaan Allah sempurna, meliputi keagungan sifat dan kedermawanan-Nya sekaligus.","Diucapkan dalam shalawat Ibrahimiyah: \"...kama barakta 'ala Ibrahima, innaka Hamidun Majid\".","QS. Hud 11:73"],
["الْبَاعِثُ","Al-Ba'its","Yang Maha Membangkitkan","Allah membangkitkan seluruh manusia dari kematian pada hari kiamat untuk dihisab.","Menumbuhkan kesadaran akan hari kebangkitan sehingga senantiasa mempersiapkan bekal amal.","QS. Al-Hajj 22:7"],
["الشَّهِيدُ","Asy-Syahid","Yang Maha Menyaksikan","Allah menyaksikan segala perbuatan hamba-Nya secara langsung, tiada satu pun luput dari-Nya.","Menumbuhkan kejujuran karena menyadari Allah menjadi saksi atas setiap ucapan dan perbuatan.","QS. Al-Hajj 22:17; QS. Ali 'Imran 3:98"],
["الْحَقُّ","Al-Haqq","Yang Maha Benar","Allah adalah kebenaran mutlak; segala firman dan janji-Nya pasti benar adanya.","Menumbuhkan keyakinan teguh terhadap janji Allah, tidak ragu terhadap kebenaran ajaran-Nya.","QS. Al-Hajj 22:6; QS. Thaha 20:114"],
["الْوَكِيلُ","Al-Wakil","Yang Maha Memelihara","Allah adalah sebaik-baik pelindung dan penjamin urusan hamba-Nya yang bertawakal.","Diucapkan \"Hasbunallahu wa ni'mal wakil\" ketika menyerahkan segala urusan sepenuhnya kepada Allah.","QS. Ali 'Imran 3:173; QS. Al-Ahzab 33:3"],
["الْقَوِيُّ","Al-Qawiyyu","Yang Maha Kuat","Kekuatan Allah tidak terbatas dan tidak pernah melemah dalam menolong hamba-Nya.","Dipanjatkan memohon kekuatan menghadapi kesulitan besar yang terasa di luar kemampuan diri.","QS. Al-Hajj 22:40; QS. Al-Anfal 8:52"],
["الْمَتِينُ","Al-Matin","Yang Maha Kokoh","Kekuatan dan keteguhan Allah tidak tergoyahkan oleh apa pun.","Menumbuhkan keteguhan hati dalam mempertahankan iman meski dihadapkan berbagai godaan dan tekanan.","QS. Adz-Dzariyat 51:58"],
["الْوَلِيُّ","Al-Waliyy","Yang Maha Melindungi","Allah adalah pelindung dan penolong utama bagi hamba-hamba-Nya yang beriman.","Dipanjatkan memohon perlindungan dan pertolongan Allah di atas segala bentuk perlindungan lainnya.","QS. Asy-Syura 42:28; QS. Al-Baqarah 2:257"],
["الْحَمِيدُ","Al-Hamid","Yang Maha Terpuji","Seluruh pujian yang hakiki hanya layak ditujukan kepada Allah atas kesempurnaan-Nya.","Diucapkan dalam tahmid \"Alhamdulillah\" atas setiap nikmat yang diterima.","QS. Ibrahim 14:1, 8"],
["الْمُحْصِي","Al-Muhshi","Yang Maha Menghitung","Allah menghitung dan mencatat segala sesuatu secara terperinci, tiada satu pun terlewat.","Menumbuhkan kesadaran bahwa setiap amal, sekecil apa pun, tercatat rapi di sisi Allah.","QS. Maryam 19:94; QS. Al-Jinn 72:28"],
["الْمُبْدِئُ","Al-Mubdi'","Yang Maha Memulai","Allah memulai penciptaan makhluk dari tiada tanpa contoh sebelumnya.","Direnungkan sebagai bukti kekuasaan Allah untuk memulai kembali penciptaan pada hari kebangkitan.","QS. Al-Buruj 85:13; QS. Al-'Ankabut 29:19"],
["الْمُعِيدُ","Al-Mu'id","Yang Maha Mengembalikan","Allah berkuasa mengembalikan atau mengulang ciptaan-Nya, sebagaimana Dia membangkitkan manusia setelah mati.","Menguatkan keyakinan terhadap hari kebangkitan, bahwa Allah mampu menghidupkan kembali yang telah tiada.","QS. Al-Buruj 85:13; QS. Ar-Rum 30:27"],
["الْمُحْيِي","Al-Muhyi","Yang Maha Menghidupkan","Allah memberi kehidupan kepada makhluk yang tadinya tiada, termasuk kelak membangkitkan yang telah mati.","Direnungkan ketika melihat tanda kehidupan di alam (tumbuhnya tanaman, kelahiran) sebagai bukti kekuasaan Allah.","QS. Ar-Rum 30:50; QS. Fushshilat 41:39"],
["الْمُمِيتُ","Al-Mumit","Yang Maha Mematikan","Allah menetapkan ajal kematian bagi setiap makhluk yang bernyawa, tiada yang dapat menghindarinya.","Menumbuhkan kesadaran akan kematian (dzikrul maut) sehingga senantiasa mempersiapkan amal terbaik.","QS. Al-Mu'minun 23:80; QS. Ghafir 40:68"],
["الْحَيُّ","Al-Hayy","Yang Maha Hidup","Kehidupan Allah kekal abadi, tidak pernah mati dan tidak bergantung pada apa pun.","Dipanjatkan bersama Al-Qayyum dalam Ayat Kursi sebagai permohonan pertolongan atas nama kehidupan-Nya yang kekal.","QS. Al-Baqarah 2:255; QS. Ghafir 40:65"],
["الْقَيُّومُ","Al-Qayyum","Yang Maha Berdiri Sendiri","Allah mengurus dan menegakkan seluruh alam semesta tanpa bergantung kepada siapa pun, sedangkan seluruh makhluk bergantung kepada-Nya.","Dipanjatkan dalam doa-doa besar seperti Ayat Kursi dan doa \"Ya Hayyu ya Qayyum\".","QS. Al-Baqarah 2:255; QS. Ali 'Imran 3:2"],
["الْوَاجِدُ","Al-Wajid","Yang Maha Menemukan","Allah tidak pernah kehilangan apa pun yang Dia kehendaki, Mahakaya tanpa kebutuhan.","Menumbuhkan rasa cukup (qana'ah), meyakini Allah tidak pernah kekurangan untuk memberi kepada hamba-Nya.",""],
["الْمَاجِدُ","Al-Majiid","Yang Maha Mulia","Kemuliaan Allah meliputi keluasan karunia dan keagungan sifat-Nya sekaligus.","Direnungkan bersama makna Al-Majid dalam shalawat sebagai pengakuan kemuliaan Allah dan Rasul-Nya.","QS. Hud 11:73"],
["الْوَاحِدُ","Al-Wahid","Yang Maha Esa","Allah esa dalam mencipta, mengatur, dan menguasai alam semesta tanpa sekutu dalam perbuatan-Nya.","Menguatkan tauhid rububiyah, meyakini tiada pengatur alam semesta selain Allah.","QS. Ar-Ra'd 13:16; QS. Az-Zumar 39:4"],
["الْأَحَدُ","Al-Ahad","Yang Maha Tunggal","Allah tunggal dalam zat-Nya, tidak tersusun dari bagian dan tidak ada yang menyerupai-Nya.","Diucapkan dalam Surah Al-Ikhlas sebagai inti tauhid yang paling murni.","QS. Al-Ikhlas 112:1"],
["الصَّمَدُ","Ash-Shamad","Yang Maha Dibutuhkan","Seluruh makhluk bergantung dan membutuhkan Allah, sementara Dia tidak membutuhkan siapa pun.","Dipanjatkan ketika menyadari kebergantungan total kepada Allah dalam setiap urusan.","QS. Al-Ikhlas 112:2"],
["الْقَادِرُ","Al-Qadir","Yang Maha Menentukan","Allah berkuasa penuh mewujudkan atau mencegah segala sesuatu sesuai kehendak-Nya.","Dipanjatkan dalam doa memohon sesuatu yang tampak mustahil bagi manusia namun mudah bagi Allah.","QS. Al-Baqarah 2:20, 106"],
["الْمُقْتَدِرُ","Al-Muqtadir","Yang Maha Berkuasa","Kekuasaan Allah sempurna dan tak terbatas atas segala sesuatu di alam semesta.","Direnungkan ketika menyaksikan kejadian besar di luar kendali manusia, sebagai bukti kekuasaan mutlak Allah.","QS. Al-Qamar 54:42, 55"],
["الْمُقَدِّمُ","Al-Muqaddim","Yang Maha Mendahulukan","Allah mendahulukan siapa yang dikehendaki-Nya dalam kebaikan, kedudukan, atau amal saleh.","Dipanjatkan memohon didahulukan dalam kebaikan dan amal saleh dibanding keburukan.",""],
["الْمُؤَخِّرُ","Al-Mu'akhkhir","Yang Maha Mengakhirkan","Allah mengakhirkan atau menunda sesuatu sesuai hikmah-Nya, termasuk menangguhkan azab bagi yang durhaka.","Menumbuhkan kesabaran menunggu ketetapan Allah yang mungkin tertunda namun pasti tiba pada waktunya.","QS. Ibrahim 14:42"],
["الْأَوَّلُ","Al-Awwal","Yang Maha Awal","Allah telah ada sebelum segala sesuatu diciptakan, tanpa permulaan.","Direnungkan untuk menyadari bahwa Allah mendahului segala sesuatu, termasuk waktu dan ruang.","QS. Al-Hadid 57:3"],
["الْآخِرُ","Al-Akhir","Yang Maha Akhir","Allah akan tetap ada setelah seluruh makhluk musnah, tiada akhir bagi keberadaan-Nya.","Menguatkan keyakinan bahwa hanya Allah yang kekal, sementara segala sesuatu selain-Nya akan binasa.","QS. Al-Hadid 57:3"],
["الظَّاهِرُ","Azh-Zhahir","Yang Maha Nyata","Keberadaan Allah nyata dibuktikan oleh tanda-tanda kekuasaan-Nya yang tampak di seluruh alam semesta.","Direnungkan melalui tafakur terhadap ciptaan sebagai bukti nyata keberadaan dan kekuasaan Allah.","QS. Al-Hadid 57:3"],
["الْبَاطِنُ","Al-Bathin","Yang Maha Tersembunyi","Hakikat zat Allah tidak dapat dijangkau indra dan akal manusia, tersembunyi dari penglihatan makhluk di dunia.","Menumbuhkan kerendahan hati bahwa akal manusia terbatas dalam memahami hakikat Allah sepenuhnya.","QS. Al-Hadid 57:3"],
["الْوَالِي","Al-Wali","Yang Maha Memerintah","Allah menguasai dan mengatur seluruh urusan makhluk-Nya sebagai pemilik dan pelindung sejati.","Dipanjatkan memohon agar segala urusan diserahkan dan diatur sepenuhnya di bawah pengaturan Allah.","QS. Ar-Ra'd 13:11"],
["الْمُتَعَالِي","Al-Muta'ali","Yang Maha Tinggi","Allah Mahatinggi, jauh dari segala kekurangan dan penyerupaan dengan makhluk-Nya.","Direnungkan untuk membersihkan hati dari segala prasangka yang menyamakan Allah dengan makhluk.","QS. Ar-Ra'd 13:9"],
["الْبَرُّ","Al-Barr","Yang Maha Baik","Kebaikan dan kelembutan Allah kepada hamba-Nya sangat luas, melampaui apa yang layak diterima hamba.","Dipanjatkan mensyukuri kebaikan Allah yang terus mengalir meski hamba banyak berbuat dosa.","QS. Ath-Thur 52:28"],
["التَّوَّابُ","At-Tawwab","Yang Maha Penerima Taubat","Allah senantiasa membuka pintu taubat dan menerima kembali hamba-Nya yang kembali kepada-Nya.","Dipanjatkan setiap kali bertaubat, meyakini Allah pasti menerima taubat yang tulus.","QS. An-Nisa' 4:16; QS. At-Taubah 9:104"],
["الْمُنْتَقِمُ","Al-Muntaqim","Yang Maha Pembalas","Allah membalas kezaliman dan kejahatan pelakunya yang tidak bertaubat dengan balasan yang setimpal.","Direnungkan sebagai peringatan agar berhenti dari kezaliman sebelum datang balasan Allah.","QS. As-Sajdah 32:22; QS. Ibrahim 14:47"],
["الْعَفُوُّ","Al-'Afuww","Yang Maha Pemaaf","Allah menghapuskan dosa hamba-Nya tanpa bekas, bahkan tanpa perlu mengungkitnya kembali.","Diamalkan lewat doa yang diajarkan kepada Aisyah untuk malam Lailatul Qadar: \"Allahumma innaka 'afuwwun tuhibbul-'afwa fa'fu 'anni\" (HR. Tirmidzi no. 3513).","QS. An-Nisa' 4:99, 149"],
["الرَّءُوفُ","Ar-Ra'uf","Yang Maha Pengasih","Kelembutan dan belas kasih Allah kepada hamba-Nya sangat mendalam, melebihi kasih sayang makhluk mana pun.","Dipanjatkan memohon belas kasih Allah di saat-saat sulit dan penuh keputusasaan.","QS. Al-Baqarah 2:143; QS. At-Taubah 9:117"],
["مَالِكُ الْمُلْكِ","Malikul-Mulk","Yang Maha Pemilik Kerajaan","Allah pemilik mutlak seluruh kerajaan alam semesta, memberikan dan mencabut kekuasaan sekehendak-Nya.","Direnungkan agar tidak silau terhadap kekuasaan duniawi, karena semuanya di tangan Allah.","QS. Ali 'Imran 3:26"],
["ذُو الْجَلَالِ وَالْإِكْرَامِ","Dzul-Jalali wal-Ikram","Yang Maha Pemilik Kebesaran dan Kemuliaan","Allah memiliki keagungan sekaligus kemuliaan yang sempurna, layak diagungkan dan dicintai sekaligus.","Dianjurkan memperbanyak menyebutnya, sebagaimana anjuran Nabi ﷺ mengulang-ulang nama ini dalam doa (HR. Tirmidzi no. 3524).","QS. Ar-Rahman 55:27, 78"],
["الْمُقْسِطُ","Al-Muqsith","Yang Maha Adil","Allah memutuskan setiap perkara dengan keadilan yang sempurna, tanpa condong sedikit pun.","Menumbuhkan ketenangan menerima keputusan Allah, meyakini tidak ada kezaliman sedikit pun di dalamnya.","QS. Yunus 10:4, 47"],
["الْجَامِعُ","Al-Jami'","Yang Maha Mengumpulkan","Allah mengumpulkan seluruh manusia pada hari kiamat untuk dihisab, serta menyatukan hal-hal yang serupa maupun berbeda sesuai kehendak-Nya.","Dipanjatkan memohon dikumpulkan kembali dengan orang-orang tercinta dalam kebaikan, di dunia maupun di surga kelak.","QS. Ali 'Imran 3:9"],
["الْغَنِيُّ","Al-Ghaniyy","Yang Maha Kaya","Allah tidak membutuhkan apa pun dari makhluk-Nya, Mahakaya secara mutlak tanpa kekurangan sedikit pun.","Menumbuhkan rasa cukup dan tidak berharap kepada manusia, karena kekayaan sejati hanya milik dan dari Allah.","QS. Al-Baqarah 2:263; QS. Fathir 35:15"],
["الْمُغْنِي","Al-Mughni","Yang Maha Mencukupi","Allah mencukupkan kebutuhan hamba-Nya dan memberi kekayaan kepada siapa yang dikehendaki-Nya.","Dipanjatkan memohon kecukupan dari harta yang halal agar terhindar dari meminta-minta kepada manusia.",""],
["الْمَانِعُ","Al-Mani'","Yang Maha Mencegah","Allah mencegah datangnya keburukan atau musibah kepada hamba yang dikehendaki-Nya, atas hikmah tertentu.","Dipanjatkan memohon perlindungan agar dicegah dari bahaya dan keburukan yang mengancam, sebagaimana doa setelah shalat: \"...wa la mu'thiya lima mana'ta\" (HR. Bukhari no. 844).",""],
["الضَّارُّ","Adh-Dharr","Yang Maha Memberi Mudarat","Segala mudarat yang menimpa makhluk terjadi atas izin dan ketentuan Allah, bukan kebetulan semata.","Menumbuhkan kesabaran menerima ujian, meyakini semuanya dalam kendali dan hikmah Allah.",""],
["النَّافِعُ","An-Nafi'","Yang Maha Memberi Manfaat","Segala manfaat dan kebaikan yang diterima makhluk bersumber dari kehendak dan pemberian Allah semata.","Dipanjatkan memohon agar ilmu, harta, dan amal yang dimiliki mendatangkan manfaat bagi diri dan orang lain.",""],
["النُّورُ","An-Nur","Yang Maha Bercahaya","Allah adalah cahaya langit dan bumi, sumber petunjuk yang menerangi hati dari kegelapan kebodohan dan kesesatan.","Dipanjatkan dalam doa memohon cahaya dalam hati, penglihatan, pendengaran, dan seluruh aspek kehidupan, sebagaimana doa Nabi ﷺ: \"Allahummaj'al fi qalbi nura...\" (HR. Bukhari no. 6316, Muslim no. 763).","QS. An-Nur 24:35"],
["الْهَادِي","Al-Hadi","Yang Maha Pemberi Petunjuk","Allah membimbing hamba-Nya menuju kebenaran dan jalan yang lurus, baik petunjuk umum maupun taufik khusus bagi yang beriman.","Dipanjatkan dalam Al-Fatihah setiap shalat: \"Ihdinash-shiratal-mustaqim\" (tunjukilah kami jalan yang lurus).","QS. Al-Furqan 25:31; QS. Al-Hajj 22:54"],
["الْبَدِيعُ","Al-Badi'","Yang Maha Pencipta","Allah menciptakan langit dan bumi dengan cara yang belum pernah ada contohnya sebelumnya, penuh keajaiban.","Direnungkan melalui kekaguman terhadap keajaiban ciptaan Allah yang tiada duanya di alam semesta.","QS. Al-Baqarah 2:117; QS. Al-An'am 6:101"],
["الْبَاقِي","Al-Baqi","Yang Maha Kekal","Allah kekal selamanya, tidak akan pernah musnah, berbeda dengan seluruh makhluk yang fana.","Menumbuhkan kesadaran bahwa hanya kebaikan yang dilakukan karena Allah yang akan bernilai kekal di sisi-Nya.","QS. Ar-Rahman 55:26-27"],
["الْوَارِثُ","Al-Warits","Yang Maha Mewarisi","Allah mewarisi seluruh alam semesta setelah binasanya segala makhluk, sebagai pemilik hakiki segala sesuatu.","Menumbuhkan kesadaran bahwa harta dan kepemilikan dunia hanyalah titipan sementara yang akan kembali kepada Allah.","QS. Al-Hijr 15:23"],
["الرَّشِيدُ","Ar-Rasyid","Yang Maha Pandai","Allah membimbing seluruh urusan makhluk-Nya menuju kesempurnaan dengan bimbingan yang lurus dan tepat.","Dipanjatkan memohon bimbingan yang tepat dalam mengambil setiap keputusan penting dalam hidup.",""],
["الصَّبُورُ","Ash-Shabur","Yang Maha Sabar","Allah tidak tergesa-gesa menghukum hamba-Nya yang durhaka, memberikan tenggang waktu yang panjang untuk kembali kepada-Nya.","Dipanjatkan memohon kesabaran seluas dan seteguh sifat sabar Allah dalam menghadapi ujian hidup.","HR. Bukhari no. 6099, Muslim no. 2804 (\"Tidak ada yang lebih sabar menghadapi gangguan daripada Allah\")"]
];

(function(){
const F = "َ", I = "ِ", U = "ُ", S = "ْ", TAN = "ً ٍ ٌ";

/* RNG deterministik */
let _seed = 20260831;
function rnd(){ _seed = (_seed*1103515245 + 12345) & 0x7fffffff; return _seed/0x7fffffff; }
function shuf(arr){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function har(q){ return q==="i"?"ِ" : q==="u"?"ُ" : "َ"; }
function line(letters, q, sep){ return letters.map(l=>l+har(q)).join(sep||" "); }

/* Kombinasi pasangan unik (tanpa pengulangan) untuk satu jilid */
function makePairGen(letters, q){
  const used = new Set();
  let pool = shuf(letters), idx = 0;
  return function(count){
    const out = [];
    while(out.length < count){
      if(idx+1 >= pool.length){ pool = shuf(letters); idx = 0; }
      const a = pool[idx], b = pool[idx+1]; idx += 2;
      const s = a+har(q)+" "+b+har(q);
      if(used.has(s) || out.includes(s)) continue;
      used.add(s); out.push(s);
    }
    return out;
  };
}
function uniqWords(words, usedWords){
  const out = [];
  let pool = shuf(words), i = 0;
  while(out.length < 5){
    if(i >= pool.length){
      // bila semua kata sudah dipakai dalam satu pemindaian pool,
      // mulai siklus baru (cegah loop tak berujung)
      if(usedWords.size >= words.length) usedWords.clear();
      pool = shuf(words); i = 0;
    }
    const w = pool[i++];
    if(usedWords.has(w) || out.includes(w)) continue;
    usedWords.add(w); out.push(w);
  }
  return out;
}

const W3 = ["كِتَابٌ","مَسْجِدٌ","بَيْتٌ","قَلَمٌ","مُحَمَّدٌ","أَحْمَدُ","جَمِيلٌ","كَبِيرٌ","صَغِيرٌ","الْكِتَابُ","الْمَسْجِدُ","الرَّحْمَنُ","الرَّحِيمُ","الْحَمْدُ","شَمْسٌ","قَمَرٌ","نُورٌ","عِلْمٌ","فَلَاحٌ","حَقٌّ"];
const W4 = ["قَالَ","كَانَ","يَقُولُ","يَكُونُ","قِيلَ","سِيرَةٌ","رَسُولٌ","سَلَامٌ","إِيمَانٌ","إِحْسَانٌ","مَالٌ","نُورٌ","صَائِمٌ","قَائِمٌ","غَائِبٌ","بَابٌ","دَارٌ","نَارٌ","عَالِمٌ","مُعَلِّمٌ"];
const W5 = ["مِنْ عَمَلِهِ","أَنْعَمْتَ","مِنْ نُّعْمَةٍ","مِنْ لَدُنْ","مِنْ تَحْتِهَا","عَنْ بَعْضٍ","مِنْ بَعْدِ","تَرْمِيهِمْ بِحِجَارَةٍ","مِنْ قَبْلُ","مِنْ خَوْفٍ","مِنْ شَرِّ","لَهُمْ مَا","عَلَيْهِمْ وَلَا","مِنَ الْجِنَّةِ","مِنْ وَلِيٍّ","أَنْبَتَ"];
const W6 = ["بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ","الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ","الرَّحْمَٰنِ الرَّحِيمِ","مَالِكِ يَوْمِ الدِّينِ","إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ","اهْدِنَا الصِّرَاطَ الْمُسْتَقِيمَ","قُلْ هُوَ اللَّهُ أَحَدٌ","اللَّهُ الصَّمَدُ","لَمْ يَلِدْ وَلَمْ يُولَدْ","وَلَمْ يَكُنْ لَهُ كُفُوًا أَحَدٌ","قُلْ أَعُوذُ بِرَبِّ الْفَلَقِ","مِنْ شَرِّ مَا خَلَقَ","وَمِنْ شَرِّ غَاسِقٍ إِذَا وَقَبَ","قُلْ أَعُوذُ بِرَبِّ النَّاسِ","مَلِكِ النَّاسِ","مِنْ شَرِّ الْوَسْوَاسِ الْخَنَّاسِ","وَالْعَصْرِ","إِنَّ الْإِنْسَانَ لَفِي خُسْرٍ","إِنَّا أَعْطَيْنَاكَ الْكَوْثَرَ","فَصَلِّ لِرَبِّكَ وَانْحَرْ"];

function buildJilid(cfg){
  const pages = [];
  const n = 32, usedWords = new Set();
  const pairGen = makePairGen(HU, cfg.q);
  for(let i=1; i<=n; i++){
    let lines = [];
    if(cfg.letterPages && i <= cfg.letterPages){
      const group = HU.slice((i-1)*cfg.per, Math.min(i*cfg.per, 28));
      lines = [line(group, cfg.q)];
      lines = lines.concat(pairGen(4));
    } else if(cfg.pairPages && i <= cfg.letterPages + cfg.pairPages){
      lines = pairGen(6);
    } else if(cfg.wordPages && i <= cfg.letterPages + cfg.pairPages + cfg.wordPages){
      lines = uniqWords(cfg.words, usedWords);
      lines = lines.concat(pairGen(1));
    } else {
      lines = uniqWords(cfg.words, usedWords);
    }
    pages.push({t:"Halaman "+i, ins:cfg.ins, l:lines.slice(0,6)});
  }
  return pages;
}


DB.IQRA_PAGES = {
  "iqra-1": buildJilid({q:"f", letterPages:7, pairPages:10, wordPages:8, per:4,
    words:W1, ins:"Baca langsung, jangan dieja. Bunyikan setiap huruf dengan fathah (a) pendek."}),
  "iqra-2": buildJilid({q:"i", letterPages:7, pairPages:10, wordPages:8, per:4,
    words:W2, ins:"Kasrah (i), dhammah (u), dan sukun (mati). Baca langsung tanpa mengeja."}),
  "iqra-3": buildJilid({q:"f", letterPages:6, pairPages:8, wordPages:12, per:4,
    words:W3, ins:"Tanwin (contoh: بً بٍ بٌ) dan huruf sambung. Perhatikan bentuk huruf di awal, tengah, akhir."}),
  "iqra-4": buildJilid({q:"f", letterPages:4, pairPages:8, wordPages:14, per:6,
    words:W4, ins:"Mad thabi'i: fathah+alif (2 harakat), kasrah+ya, dhammah+wau. Panjangkan 2 harakat."}),
  "iqra-5": buildJilid({q:"f", letterPages:2, pairPages:6, wordPages:18, per:8,
    words:W5, ins:"Hukum nun sukun/tanwin dan mim sukun: izhar, idgham, ikhfa, iqlab. Baca sesuai hukum."}),
  "iqra-6": buildJilid({q:"f", letterPages:1, pairPages:5, wordPages:20, per:10,
    words:W6, ins:"Bacaan lancar: surah pendek dan kalimat Al-Qur'an dengan tartil. Setelah ini siap membaca mushaf."})
};

/* Sinkronkan tiap baris: (sudah berupa string utuh; sisipkan instruksi per halaman) */
})();

<script>
/* ============================================================
   SILMIKAFFAH — Mesin Perhitungan (calc.js)
   Waktu shalat (astronomis, tidak hardcode) · Kalender Hijriah
   (Intl islamic-umalqura) · Kalkulator Zakat (transparan)
   ============================================================ */
const CALC = window.SILMIKAFFAH.CALC = {};

/* ---------- WAKTU SHALAT ---------- */
CALC.PRAY_METHODS = {
  KEMENAG: {name:"Kemenag RI (Fajar 20°, Isya 18°)", fajr:20, isha:18, fixed:0},
  MWL:     {name:"Muslim World League (18°, 17°)", fajr:18, isha:17, fixed:0},
  ISNA:    {name:"ISNA (15°, 15°)", fajr:15, isha:15, fixed:0},
  EGYPT:   {name:"Mesir (19.5°, 17.5°)", fajr:19.5, isha:17.5, fixed:0},
  KARACHI: {name:"Karachi (18°, 18°)", fajr:18, isha:18, fixed:0},
  MAKKAH:  {name:"Umm al-Qura Makkah (18.5°, Isya +90 mnt)", fajr:18.5, isha:0, fixed:90}
};
CALC.ASR_METHODS = { JUMHUR:{name:"Jumhur (bayangan 1× tinggi)", factor:1}, HANAFI:{name:"Hanafi (bayangan 2×)", factor:2} };

function rad(d){return d*Math.PI/180;}
function deg(r){return r*180/Math.PI;}
function fixangle(a){a=a-360*Math.floor(a/360);return a<0?a+360:a;}
function fixhour(a){a=a-24*Math.floor(a/24);return a<0?a+24:a;}
function dsin(d){return Math.sin(rad(d));}
function dcos(d){return Math.cos(rad(d));}
function dtan(d){return Math.tan(rad(d));}
function datan2(y,x){return deg(Math.atan2(y,x));}
function julian(y,m,d){
  if(m<=2){y-=1;m+=12;}
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixangle(357.529+0.98560028*D);
  const q=fixangle(280.459+0.98564736*D);
  const L=fixangle(q+1.915*Math.sin(rad(g))+0.020*Math.sin(rad(2*g)));
  const e=23.439-0.00000036*D;
  const RA=datan2(dcos(e)*dsin(L),dcos(L))/15;
  const decl=deg(Math.asin(Math.sin(rad(e))*dsin(L)));
  const EqT=q/15-fixhour(RA);
  return {decl, EqT};
}
function midDay(jd, t){const e=sunPosition(jd+ t/24).EqT; return fixhour(12-e);}
function hourAngle(angle, decl, lat){
  const a=rad(angle), d=rad(decl), L=rad(lat);
  const c=(Math.sin(a)-dsin(decl)*Math.sin(L))/(dcos(decl)*dcos(L));
  return deg(Math.acos(Math.max(-1,Math.min(1,c))))/15;
}

CALC.computePrayerTimes = function(date, lat, lon, methodKey, asrKey, tzHours){
  const M = CALC.PRAY_METHODS[methodKey] || CALC.PRAY_METHODS.KEMENAG;
  const A = CALC.ASR_METHODS[asrKey] || CALC.ASR_METHODS.JUMHUR;
  const y=date.getFullYear(), m=date.getMonth()+1, d=date.getDate();
  // tzHours: offset UTC kota (default: offset perangkat, DST-aware)
  const tz = (tzHours===undefined) ? -date.getTimezoneOffset()/60 : tzHours;
  const jd = julian(y,m,d);            // ≈ JD 12:00 UT
  const {decl, EqT} = sunPosition(jd);
  const noonUT = 12 - lon/15 - EqT;    // tengah hari matahari (UT, jam)
  const H = a => hourAngle(a, decl, lat); // sudut jam (jam)
  const mk = t => {
    const tt = fixhour(t + tz);        // konversi ke jam dinding lokal
    const h = Math.floor(tt), mn = Math.floor((tt-h)*60 + 0.5);
    const hh = ((h+24)%24);
    return {min: hh*60+mn, label: String(hh).padStart(2,"0")+":"+String(mn).padStart(2,"0")};
  };
  const dLat = Math.abs(lat - decl);
  // Asar: ketinggian matahari saat bayangan = panjang benda + bayangan saat zuhur
  const asrAngle = deg(Math.atan(1/(A.factor + Math.tan(rad(dLat)))));
  const sunset = noonUT + H(-0.833);
  return {
    imsak:   mk(noonUT - H(-M.fajr) - 10/60), // kehati-hatian (konvensi Indonesia)
    subuh:   mk(noonUT - H(-M.fajr)),
    terbit:  mk(noonUT - H(-0.833)),
    zuhur:   mk(noonUT),
    asar:    mk(noonUT + H(asrAngle)),
    maghrib: mk(sunset),
    isya:    mk(M.fixed>0 ? sunset + M.fixed/60 : noonUT + H(-M.isha)),
    method: M.name, asrMethod: A.name
  };
};

CALC.nextPrayer = function(times, nowMin){
  // Hanya 5 shalat wajib — Terbit & Imsak BUKAN waktu shalat, jangan pernah muncul sebagai "shalat berikutnya"
  const order = [["subuh","Subuh"],["zuhur","Zuhur"],["asar","Asar"],["maghrib","Maghrib"],["isya","Isya"]];
  for(let i=0;i<order.length;i++){
    if(times[order[i][0]].min > nowMin) return {key:order[i][0], name:order[i][1], min:times[order[i][0]].min};
  }
  // sudah lewat Isya — shalat berikutnya adalah Subuh besok
  return {key:"subuh", name:"Subuh (besok)", min:times.subuh.min + 1440};
};

/* ---------- KALENDER HIJRIAH ---------- */
const HIJRI_MONTHS = ["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Sya'ban","Ramadan","Syawal","Dzulqa'dah","Dzulhijjah"];
const hFmt = new Intl.DateTimeFormat("en-u-ca-islamic-umalqura", {day:"numeric", month:"numeric", year:"numeric"});

CALC.hijriParts = function(date){
  const p = hFmt.formatToParts(date), o = {day:1, month:1, year:1446};
  p.forEach(x=>{ if(x.type==="day")o.day=+x.value; if(x.type==="month")o.month=+x.value; if(x.type==="year")o.year=+x.value; });
  return o;
};
CALC.hijriLabel = function(date){
  const p = CALC.hijriParts(date);
  return {hijri: p.day+" "+HIJRI_MONTHS[p.month-1]+" "+p.year+" H", day:p.day, month:p.month, monthName:HIJRI_MONTHS[p.month-1], year:p.year};
};
CALC.hijriStart = function(cursor){
  const d = new Date(cursor);
  let i=0;
  while(CALC.hijriParts(d).day!==1 && i<60){ d.setDate(d.getDate()-1); i++; }
  return d;
};
CALC.hijriMonth = function(cursor){
  const start = CALC.hijriStart(cursor);
  const parts = CALC.hijriParts(start);
  const cells = [];
  const today = new Date(); today.setHours(0,0,0,0);
  for(let i=0;i<31;i++){
    const g = new Date(start); g.setDate(start.getDate()+i);
    const p = CALC.hijriParts(g);
    if(p.month!==parts.month) break;
    const g0 = new Date(g); g0.setHours(0,0,0,0);
    cells.push({
      gDate: g, hDay: p.day,
      isToday: g0.getTime()===today.getTime(),
      dow: g.getDay(),
      events: DB.EVENTS.filter(e=>e.month===HIJRI_MONTHS[p.month-1] && e.day===p.day)
    });
  }
  return {monthName:HIJRI_MONTHS[parts.month-1], year:parts.year, cells, start};
};
CALC.shiftHijriMonth = function(cursor, dir){
  const start = CALC.hijriStart(cursor);
  const d = new Date(start);
  d.setDate(d.getDate() + (dir>0?35:-15));
  return d;
};

/* ---------- KALKULATOR ZAKAT ---------- */
const fmtRp = n => "Rp " + Math.round(n).toLocaleString("id-ID");
CALC.zakat = function(type, inp){
  const today = new Date().toLocaleDateString("id-ID", {day:"numeric", month:"long", year:"numeric"});
  const out = {result:null, label:"", rows:[], method:"", notes:[], source:"", date:today};
  const goldPrice = +inp.goldPrice||0, silverPrice = +inp.silverPrice||0;
  if(type==="fitrah"){
    const qty = +inp.qty||2.5, price = +inp.price||0;
    out.result = qty*price;
    out.label = "Zakat Fitrah";
    out.rows.push(["Beras total (jiwa × kg)", qty+" kg × Rp "+price.toLocaleString("id-ID")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "1 sha' (±2,5 kg) makanan pokok per orang; konvensi lain 3,5 liter. Dikeluarkan sebelum shalat Idulfitri.";
    out.source = "HR. Bukhari no. 1503, Muslim no. 984; BAZNAS";
    out.notes.push("Boleh dibayar dalam bentuk uang senilai makanan pokok menurut sebagian lembaga (BAZNAS).");
    return out;
  }
  if(type==="emas"){
    const g = +inp.grams||0;
    out.result = g>=85 ? 0.025*g*goldPrice : 0;
    out.label = "Zakat Emas";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "85 gram — "+(g>=85?"tercapai":"belum tercapai")]);
    out.rows.push(["Zakat", g>=85 ? "2,5% × "+g+"g × Rp "+goldPrice.toLocaleString("id-ID") : "—"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari emas ≥ 85 gram yang dimiliki selama satu tahun (haul).";
    out.source = "BAZNAS; ketentuan nishab dari hadis";
    out.notes.push("Perhiasan yang dipakai secara wajar: jumhur tidak mewajibkan zakatnya; mazhab Hanafi mewajibkan.");
    return out;
  }
  if(type==="perak"){
    const g = +inp.grams||0;
    out.result = g>=595 ? 0.025*g*silverPrice : 0;
    out.label = "Zakat Perak";
    out.rows.push(["Kepemilikan", g+" gram"]);
    out.rows.push(["Nishab", "595 gram — "+(g>=595?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari perak ≥ 595 gram dengan haul satu tahun.";
    out.source = "BAZNAS; HR. Abu Dawud no. 1573";
    return out;
  }
  if(type==="uang"){
    const bal = +inp.balance||0;
    const nisab = 85*goldPrice;
    out.result = bal>=nisab ? 0.025*bal : 0;
    out.label = "Zakat Uang & Tabungan";
    out.rows.push(["Saldo", fmtRp(bal)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(bal>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Uang diqiyaskan pada emas: nishab senilai 85 gram emas, 2,5%, haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="mal"){
    const cash=+inp.cash||0, g=+inp.gold||0, s=+inp.silver||0, trade=+inp.trade||0, recv=+inp.receivables||0, debt=+inp.debts||0;
    const haul = inp.haul==="yes";
    const nMethod = inp.nisabMethod==="perak"?"perak":"emas";
    const assets = cash + g*goldPrice + s*silverPrice + trade + recv - debt;
    const nisab = nMethod==="emas" ? 85*goldPrice : 595*silverPrice;
    out.result = (haul && assets>=nisab) ? 0.025*assets : 0;
    out.label = "Zakat Mal (Harta)";
    out.rows.push(["Kas + emas + perak + dagangan + piutang", fmtRp(cash+g*goldPrice+s*silverPrice+trade+recv)]);
    out.rows.push(["Dikurangi utang jatuh tempo", "− "+fmtRp(debt)]);
    out.rows.push(["Harta bersih", fmtRp(assets)]);
    out.rows.push(["Nishab ("+nMethod+")", fmtRp(nisab)+" — "+(assets>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Haul 1 tahun", haul?"terpenuhi":"belum terpenuhi"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari harta bersih yang mencapai nishab (85g emas / 595g perak) dan haul 1 tahun.";
    out.source = "BAZNAS; fiqih zakat";
    out.notes.push(haul?"":"Jika haul belum satu tahun, zakat mal belum wajib (kecuali jenis yang dizakati saat panen).");
    return out;
  }
  if(type==="perdagangan"){
    const asset=+inp.asset||0, debt=+inp.debt||0;
    const haul = inp.haul==="yes";
    const net = asset-debt, nisab = 85*goldPrice;
    out.result = (haul && net>=nisab) ? 0.025*net : 0;
    out.label = "Zakat Perdagangan";
    out.rows.push(["Nilai aset dagang (barang + kas + piutang)", fmtRp(asset)]);
    out.rows.push(["Dikurangi utang", "− "+fmtRp(debt)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab (85g emas)", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "2,5% dari nilai barang dagangan (dinilai harga pasar) + kas + piutang − utang, dengan nishab 85g emas dan haul 1 tahun.";
    out.source = "BAZNAS";
    return out;
  }
  if(type==="penghasilan"){
    const inc=+inp.income||0, debtM=+inp.debtMonthly||0;
    const m = inp.method==="b"?"b":"a";
    const ricePrice=+inp.ricePrice||0;
    const net = inc-debtM;
    const nisabA = (85*goldPrice)/12;
    const nisabB = (653*ricePrice)/12;
    const nisab = m==="a"?nisabA:nisabB;
    out.result = net>=nisab ? 0.025*net : 0;
    out.label = "Zakat Penghasilan (Profesi)";
    out.rows.push(["Penghasilan bulanan", fmtRp(inc)]);
    out.rows.push(["Dikurangi utang bulanan", "− "+fmtRp(debtM)]);
    out.rows.push(["Bersih", fmtRp(net)]);
    out.rows.push(["Nishab bulanan", fmtRp(nisab)+" — "+(net>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = m==="a"
      ? "Metode A (umum): nishab 85 gram emas setahun dibagi 12; jika penghasilan bulanan mencapai nishab bulanan, keluarkan 2,5% tiap bulan."
      : "Metode B: nishab diqiyaskan pada 5 wasaq (±653 kg) beras setahun, dibagi 12.";
    out.source = "BAZNAS (Metode A); pendapat ulama kontemporer (Metode B)";
    out.notes.push("Ada perbedaan pendapat tentang nishab penghasilan — gunakan metode yang Anda yakini / konsultasikan amil setempat.");
    return out;
  }
  if(type==="pertanian"){
    const val=+inp.value||0, irr=inp.irrigation==="alami"?"alami":"berbayar";
    const ricePrice=+inp.ricePrice||0, nisab=653*ricePrice;
    const rate = irr==="alami"?0.10:0.05;
    out.result = val>=nisab ? rate*val : 0;
    out.label = "Zakat Pertanian";
    out.rows.push(["Nilai hasil panen", fmtRp(val)]);
    out.rows.push(["Nishab 5 wasaq (±653 kg × harga)", fmtRp(nisab)+" — "+(val>=nisab?"tercapai":"belum tercapai")]);
    out.rows.push(["Besaran", irr==="alami"?"10% (pengairan alami)":"5% (pengairan berbiaya)"]);
    out.rows.push(["Total", fmtRp(out.result)]);
    out.method = "Dizakati saat panen (tanpa haul): 10% bila pengairan alami, 5% bila berbiaya.";
    out.source = "QS. Al-An'am 6:141; HR. Bukhari no. 1484, Muslim no. 979";
    return out;
  }
  if(type==="peternakan"){

      out.rows.push(["Zakat", out.result+" ekor kambing/domba (umur 1–2 tahun)"]);
      out.method = "40–120: 1; 121–200: 2; 201–300: 3; 300+: 1 tiap 100.";
      out.source = "HR. Bukhari no. 1454";
    } else {
      let z="", due=0;
      if(c>=30){due=1; if(c<40)z="1 ekor tabi' (umur 1 tahun)";
        else if(c<60)z="1 ekor musinnah (umur 2 tahun)";
        else if(c<70)z="2 ekor tabi'";
        else if(c<80)z="1 musinnah + 1 tabi'";
        else if(c<90)z="2 ekor musinnah";
        else if(c<100)z="3 ekor tabi'";
        else if(c<110)z="1 musinnah + 2 tabi'";
        else if(c<120)z="2 musinnah + 1 tabi'";
        else if(c<130)z="3 musinnah (atau 4 tabi')";
        else {due=0; z="Tiap 30 ekor: +1 tabi'; tiap 40 ekor: +1 musinnah";}
      }
      out.result = due; out.zakatLabel = z;
      out.rows.push(["Jumlah", c+" ekor"]);
      out.rows.push(["Nishab", "30 ekor"]);
      out.rows.push(["Zakat", z]);
      out.method = "Tabel zakat sapi (sa'imah, haul 1 tahun).";
      out.source = "BAZNAS; ketentuan zakat ternak";
    }
    out.notes.push("Syarat: digembalakan (sa'imah), mencapai nishab, haul 1 tahun.");
    out.date = today;
    return out;
  }
  return out;
};

<script>
/* ============================================================
   SILMIKAFFAH — Lapisan API & Cache (api.js)
   API-first dengan fallback lokal:
   - Aladhan API  → jadwal shalat + tanggal hijriah
   - Quran.com v4 → 6236 ayat (Arab + terjemahan Indonesia)
   - islamic.network CDN → audio murottal Al-Qur'an (legal)
   - api.hadith.gading.dev → kitab hadis (Arab + terjemahan)
   Semua punya fallback: jika API gagal, data lokal dipakai.
   ============================================================ */
const API = window.SILMIKAFFAH.API = {};

/* ---------- helper fetch dengan timeout ---------- */
API.fetchJSON = function(url, timeoutMs){
  return new Promise((resolve, reject)=>{
    const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
    const t = setTimeout(()=>{ if(ctrl) ctrl.abort(); reject(new Error("timeout")); }, timeoutMs||9000);
    fetch(url, ctrl?{signal:ctrl.signal}:undefined)
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(d=>{ clearTimeout(t); resolve(d); })
      .catch(e=>{ clearTimeout(t); reject(e); });
  });
};

/* ---------- cache lokal (memory + localStorage) ---------- */
const _mem = new Map();
function cacheGet(key){
  if(_mem.has(key)) return _mem.get(key);
  try{ const raw = localStorage.getItem("silk_api_"+key); if(raw) return JSON.parse(raw); }catch(e){}
  return null;
}
function cacheSet(key, val, ttlMs){
  _mem.set(key, val);
  try{
    localStorage.setItem("silk_api_"+key, JSON.stringify({v:val, t:Date.now(), ttl:ttlMs||0}));
    // jaga ukuran: jika total > 3,5 MB, buang entri tertua
    let total = 0, keys = [];
    for(let i=0;i<localStorage.length;i++){
      const k = localStorage.key(i);
      if(k && k.indexOf("silk_api_")===0){ const v = localStorage.getItem(k); total += v.length; keys.push([k, (JSON.parse(v)||{}).t||0]); }
    }
    if(total > 3.5*1024*1024 && keys.length>3){
      keys.sort((a,b)=>a[1]-b[1]);
      for(let i=0;i<Math.max(1,keys.length/2);i++) localStorage.removeItem(keys[i][0]);
    }
  }catch(e){ /* storage penuh — lewati */ }
}
function cacheGetTtl(key, ttlMs){
  const c = cacheGet(key);
  if(!c) return null;
  if(c.ttl && c.t && (Date.now()-c.t) > c.ttl) return null;
  return c.v;
}

/* ============================================================
   A. JADWAL SHALAT — ALADHAN API (+ fallback kalkulasi lokal)
   ============================================================ */
const ALADHAN_METHOD = {KEMENAG:20, MWL:3, ISNA:2, EGYPT:5, MAKKAH:4, KARACHI:1};
API.getPrayerTimes = async function(date, lat, lon, methodKey, asrKey, tzHours){
  const local = CALC.computePrayerTimes(date, lat, lon, methodKey, asrKey, tzHours);
  try{
    const dd = date.getDate(), mm = date.getMonth()+1, yy = date.getFullYear();
    const m = ALADHAN_METHOD[methodKey]||20;
    const url = "https://api.aladhan.com/v1/timings/"+dd+"-"+mm+"-"+yy
      + "?latitude="+lat+"&longitude="+lon+"&method="+m+"&school="+(asrKey==="HANAFI"?1:0);
    const j = await API.fetchJSON(url, 8000);
    const t = j && j.data && j.data.timings;
    if(!t) throw new Error("no timings");
    const mk = s => {
      const p = (s||"").split(":");
      const hh = +p[0], mn = +p[1];
      return {min: hh*60+mn, label: String(hh).padStart(2,"0")+":"+String(mn).padStart(2,"0")};
    };
    const hijri = j.data.date && j.data.date.hijri;
    return {
      times: {
        imsak: mk(t.Imsak), subuh: mk(t.Fajr), terbit: mk(t.Sunrise),
        zuhur: mk(t.Dhuhr), asar: mk(t.Asr), maghrib: mk(t.Maghrib), isya: mk(t.Isha)
      },
      hijri: hijri ? {day:+hijri.day, month:hijri.month.number, year:+hijri.year, monthName:hijri.month.en} : null,
      source: "Aladhan API"
    };
  }catch(err){
    return {times: local, source: "Perhitungan lokal (offline)"};
  }
};

/* ============================================================
   B. AL-QUR'AN — QURAN.COM API v4 (6236 ayat) + audio CDN
   ============================================================ */
const QURAN_OFFSET = (function(){
  let off = [], sum = 0;
  window.SILMIKAFFAH.SURAHS.forEach(s=>{ off[s[0]] = sum; sum += s[5]; });
  return off;
})();
API.globalAyah = (surah, ayah) => QURAN_OFFSET[surah] + ayah;
API.ayahAudioUrls = (surah, ayah) => {
  const g = API.globalAyah(surah, ayah);
  return [
    "https://cdn.islamic.network/quran/audio/128/ar.alafasy-2/"+g+".mp3",
    "https://cdn.islamic.network/quran/audio/128/ar.alafasy/"+g+".mp3",
    "https://cdn.islamic.network/quran/audio/64/ar.alafasy/"+g+".mp3"
  ];
};
API.ayahAudioUrl = (surah, ayah) => API.ayahAudioUrls(surah, ayah)[0];
API.surahAudioUrls = (surah) => [
  "https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/"+surah+".mp3",
  "https://cdn.islamic.network/quran/audio-surah/64/ar.alafasy/"+surah+".mp3"
];

API.getSurah = async function(n){
  // cache per surah (ttl 30 hari)
  const cached = cacheGetTtl("q_surah_"+n, 30*24*3600*1000);
  if(cached) return {surah:cached, source:"cache lokal"};
  try{
    const out = [];
    let page = 1, totalPages = 1;
    while(page <= totalPages){
      const url = "https://api.quran.com/api/v4/verses/by_chapter/"+n
        + "?translations=131&fields=text_uthmani&per_page=300&page="+page;
      const j = await API.fetchJSON(url, 12000);
      const verses = j.verses || [];
      totalPages = (j.meta && j.meta.pagination && j.meta.pagination.total_pages) || 1;
      verses.forEach(v=>{
        let translation = "";
        const trs = v.translations || [];
        if(trs.length && trs[0].text) translation = trs[0].text.replace(/<[^>]+>/g,"").trim();
        out.push({
          number: v.verse_number, key: v.verse_key, juz: v.juz_number||null,
          arab: v.text_uthmani || "", translation: translation
        });
      });
      page++;
    }
    if(!out.length) throw new Error("empty");
    // fallback terjemahan: coba edition 33 bila 131 kosong
    if(!out[0].translation){
      try{
        const j = await API.fetchJSON("https://api.quran.com/api/v4/verses/by_chapter/"+n+"?translations=33&per_page=300", 10000);
        (j.verses||[]).forEach(v=>{
          const trs = v.translations||[];
          const t = trs.length ? trs[0].text.replace(/<[^>]+>/g,"").trim() : "";
          const item = out.find(x=>x.number===v.verse_number);
          if(item && t) item.translation = t;
        });
      }catch(e){}
    }
    cacheSet("q_surah_"+n, out, 30*24*3600*1000);
    return {surah:out, source:"Quran.com API"};
  }catch(err){
    // fallback: ayat contoh lokal yang tersedia
    const local = Object.keys(DBQ.AYAT).filter(k=>DBQ.AYAT[k].s===n)
      .map(k=>{ const a=DBQ.AYAT[k]; return {number:a.a, key:n+":"+a.a, juz:null, arab:a.arab, translation:a.arti}; })
      .sort((a,b)=>a.number-b.number);
    return {surah:local, source:"data lokal (API tidak terjangkau)"};
  }
};

/* ============================================================
   C. HADIS — API hadith (gading.dev) + fallback lokal
   ============================================================ */
API.HADITH_BOOKS = [
  ["bukhari","Shahih Bukhari"],["muslim","Shahih Muslim"],["abudawud","Sunan Abu Dawud"],
  ["tirmidzi","Jami' at-Tirmidzi"],["nasai","Sunan an-Nasa'i"],["ibnmajah","Sunan Ibnu Majah"],
  ["malik","Al-Muwaththa'"],["ahmad","Musnad Ahmad"]
];
API.getHadithRange = async function(book, from, to){
  const key = "h_"+book+"_"+from+"_"+to;
  const cached = cacheGetTtl(key, 24*3600*1000);
  if(cached) return {hadiths:cached, source:"cache lokal"};
  try{
    const j = await API.fetchJSON("https://api.hadith.gading.dev/books/"+book+"?range="+from+"-"+to, 10000);
    const list = (j && j.data && j.data.hadiths) ? j.data.hadiths : (j && j.hadiths) ? j.hadiths : [];
    if(!list.length) throw new Error("empty");
    const hadiths = list.map(h=>({
      number: h.number, arab: h.arab||"", id: h.id||"", narrator: h.narrator||""
    }));
    cacheSet(key, hadiths, 24*3600*1000);
    return {hadiths, source:"API hadith (gading.dev)"};
  }catch(err){
    return {hadiths:[], source:"API tidak terjangkau"};
  }
};

/* ============================================================
   D. DEBOUNCE untuk pencarian
   ============================================================ */
API.debounce = function(fn, ms){
  let t = null;
  return function(){
    const args = arguments, self = this;
    clearTimeout(t);
    t = setTimeout(()=>fn.apply(self, args), ms||250);
  };
};
</script>

  additions.forEach(a=>{ if(!DB.ENTRIES.some(x=>x.id===a.id)) addEntry(a); });

  const seen=new Set(), dedup=[];
  const richness=e=>{
    const body=JSON.stringify(e.body||[]).length;
    return body + (e.summary||"").length*2 + (e.sources||[]).length*50 + (e.related||[]).length*10;
  };
  const groups={};
  DB.ENTRIES.forEach(e=>(groups[e.id]||(groups[e.id]=[])).push(e));
  Object.keys(groups).forEach(id=>{
    const g=groups[id];
    g.sort((a,b)=>richness(b)-richness(a));
    dedup.push(g[0]);
  });
  DB.ENTRIES.length=0; dedup.forEach(e=>DB.ENTRIES.push(e));

  DB.ENTRIES.forEach(e=>{
